name: Build1
on:
  schedule:
  - cron: "*/1 * * * *"
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          fetch-depth: 0

    - name: Compile Mod with Java 17
      uses: xxanqw/compilation@v3
      with:
        java-version: "17"
      
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mod-artifacts
        path: ./build/libs
